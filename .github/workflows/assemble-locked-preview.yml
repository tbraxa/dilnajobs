name: Assemble locked preview HTML
on:
  push:
    branches: [cursor/port-dilnajobs-preview-ui-ebbf]
    paths:
      - 'design/preview-locked/.parts/**'
      - '.github/workflows/assemble-locked-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/port-dilnajobs-preview-ui-ebbf
      - name: Assemble HTML from parts
        run: |
          set -euo pipefail
          PARTS=design/preview-locked/.parts
          assemble() {
            local prefix="$1"
            local out="$2"
            mapfile -t files < <(ls "$PARTS"/${prefix}.part* 2>/dev/null | sort -V)
            if [ ${#files[@]} -eq 0 ]; then
              echo "skip $out (no parts)"
              return 0
            fi
            cat "${files[@]}" > "$out"
            echo "assembled $out ($(wc -c < "$out") bytes) from ${#files[@]} parts"
          }
          assemble index design/preview-locked/index.html
          assemble nabidky design/preview-locked/nabidky.html
          assemble nabidka design/preview-locked/nabidka.html
          assemble profirmy design/preview-locked/pro-firmy.html
      - name: Commit assembled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add design/preview-locked/index.html design/preview-locked/nabidky.html design/preview-locked/nabidka.html design/preview-locked/pro-firmy.html || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: assemble locked preview HTML from staged parts"
          git push
