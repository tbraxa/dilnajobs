name: Assemble locked preview HTML
on:
  push:
    branches: [cursor/port-dilnajobs-preview-ui-ebbf]
    paths:
      - 'design/preview-locked/.parts/**'
      - '.github/workflows/assemble-locked-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/port-dilnajobs-preview-ui-ebbf
      - name: Assemble HTML from parts
        run: |
          set -euo pipefail
          PARTS=design/preview-locked/.parts
          if ls "$PARTS"/index.part* >/dev/null 2>&1; then
            cat "$PARTS"/index.part0 "$PARTS"/index.part1 "$PARTS"/index.part2 "$PARTS"/index.part3 "$PARTS"/index.part4 > design/preview-locked/index.html
            echo "assembled index.html ($(wc -c < design/preview-locked/index.html) bytes)"
          fi
          if ls "$PARTS"/nabidky.part* >/dev/null 2>&1; then
            cat "$PARTS"/nabidky.part0 "$PARTS"/nabidky.part1 "$PARTS"/nabidky.part2 "$PARTS"/nabidky.part3 > design/preview-locked/nabidky.html
            echo "assembled nabidky.html ($(wc -c < design/preview-locked/nabidky.html) bytes)"
          fi
          if ls "$PARTS"/nabidka.part* >/dev/null 2>&1; then
            cat "$PARTS"/nabidka.part0 "$PARTS"/nabidka.part1 "$PARTS"/nabidka.part2 "$PARTS"/nabidka.part3 > design/preview-locked/nabidka.html
            echo "assembled nabidka.html ($(wc -c < design/preview-locked/nabidka.html) bytes)"
          fi
          if ls "$PARTS"/profirmy.part* >/dev/null 2>&1; then
            cat "$PARTS"/profirmy.part0 "$PARTS"/profirmy.part1 "$PARTS"/profirmy.part2 "$PARTS"/profirmy.part3 > design/preview-locked/pro-firmy.html
            echo "assembled pro-firmy.html ($(wc -c < design/preview-locked/pro-firmy.html) bytes)"
          fi
      - name: Commit assembled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add design/preview-locked/*.html || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: assemble locked preview HTML from staged parts"
          git push
