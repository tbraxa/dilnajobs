name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dilna
          POSTGRES_PASSWORD: dilna
          POSTGRES_DB: dilnajobs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dilna -d dilnajobs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://dilna_app:dilna@localhost:5432/dilnajobs
      DATABASE_ADMIN_URL: postgres://dilna:dilna@localhost:5432/dilnajobs
      SESSION_SECRET: ci-session-secret-not-for-production-use-32
      # Empty string matches Vercel’s first-deploy APP_URL=""; build must not throw ERR_INVALID_URL.
      APP_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test
      - run: npm run build
