services:
  postgres:
    image: postgres:16-alpine
    container_name: dilnajobs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dilna
      POSTGRES_PASSWORD: dilna
      POSTGRES_DB: dilnajobs
    ports:
      - "5432:5432"
    volumes:
      - dilnajobs_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dilna -d dilnajobs"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: dilnajobs-minio
    profiles: ["storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dilna
      MINIO_ROOT_PASSWORD: dilnaminio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dilnajobs_minio:/data

volumes:
  dilnajobs_pg:
  dilnajobs_minio:
