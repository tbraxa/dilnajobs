</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="logo" href="index.html">
        <span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        DílnaJobs
      </a>
      <nav class="nav" aria-label="Hlavní">
        <a href="nabidky.html">Nabídky</a>
        <a href="pro-firmy.html">Pro firmy</a>
      </nav>
      <span class="spacer"></span>
      <a class="link-quiet" href="firma-registrace.html">Inzerovat</a>
      <button type="button" class="nav-toggle" aria-label="Menu" aria-expanded="false"><span></span></button>

  <main class="auth">
    <h1>Přihlášení firmy</h1>
    <p class="note">Pošleme odkaz na e-mail. Heslo nepoužíváme.</p>
    <form action="#" method="post" onsubmit="this.querySelector('[data-ok]').hidden=false; return false;">
      <label class="field">
        <span>Firemní e-mail</span>
        <input type="email" name="email" required autocomplete="email" placeholder="jana@firma.cz">
      </label>
      <button class="btn btn-accent" type="submit">Poslat přihlašovací odkaz</button>
      <p class="note" data-ok hidden>Zkontrolujte e-mail. Odkaz platí 15 minut.</p>
    </form>
    <p class="auth-links">
      <a href="firma-registrace.html">Založit účet firmy</a>
      ·
      <a href="pro-firmy.html">Ceník</a>
    </p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>DílnaJobs · přímo od firem · bez agentur</span>
      <span><a href="mailto:ahoj@dilnajobs.cz">ahoj@dilnajobs.cz</a></span>
    </div>
  </footer>
  <script src="app.js"></script>
