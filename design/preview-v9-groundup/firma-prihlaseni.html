<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Přihlášení firmy · DílnaJobs</title>
  <meta name="description" content="Přihlaste se k účtu firmy odkazem z e-mailu. Správa inzerátů a odpovědí uchazečů.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="index.html" aria-label="DílnaJobs">
        <span class="logo-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        DílnaJobs
      </a>
      <nav class="nav-main" aria-label="Hlavní">
        <a href="nabidky.html">Nabídky</a>
        <a href="pro-firmy.html">Pro firmy</a>
      </nav>
      <div class="header-actions">
        <a class="btn btn-ghost btn-sm" href="firma-registrace.html">Registrace firmy</a>
      </div>
      <button class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
    <nav class="nav-drawer wrap" aria-label="Mobilní">
      <a href="nabidky.html">Nabídky</a>
      <a href="pro-firmy.html">Pro firmy</a>
      <a href="firma-registrace.html">Registrace firmy</a>
    </nav>
  </header>

  <main class="auth-page">
    <div class="auth-card auth-card-narrow">
      <h1>Přihlášení firmy</h1>
      <p class="sub">Na e-mail pošleme odkaz pro přihlášení.</p>
      <form action="#" method="post" onsubmit="return false;">
        <div class="form-group">
          <label for="email">Pracovní e-mail</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="jmeno@firma.cz" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Poslat přihlašovací odkaz</button>
        <p class="auth-helper">Odkaz platí 15 minut. Heslo nepoužíváme.</p>
      </form>
      <p class="auth-footer">Nemáte účet? <a href="firma-registrace.html">Zaregistrujte firmu</a></p>
      <p class="auth-note">Náhled. Odkaz zatím neodesíláme.</p>
    </div>
  </main>

  <script src="menu.js"></script>
</body>
</html>
